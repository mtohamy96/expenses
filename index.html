<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفي</title>
<meta name="theme-color" content="#1b7f5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#14231e;--mut:#6b7a74;--line:#dde4df;--acc:#1b7f5c;--acci:#fff;--bad:#c4472f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#18241f;--ink:#e6efe9;--mut:#8fa299;--line:#27362f;--acc:#3fbf93;--acci:#06231a;--bad:#ef7a62}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;margin:2px 0 8px}
small,.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
button,input,select{font:inherit;color:inherit}
button,.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;touch-action:manipulation;display:inline-block}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0}
.pri{background:var(--acc);color:var(--acci);border-color:var(--acc);font-weight:700}.dng{color:var(--bad)}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:right;margin-bottom:6px;padding:10px 12px}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}.tx small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh{display:flex;justify-content:space-between;margin:14px 2px 6px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
#mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#mn b{font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);padding:4px}nav button.on{color:var(--acc);font-weight:700}
nav .fab{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acci);font-size:30px;margin:-26px auto 0;box-shadow:0 4px 12px rgba(0,0,0,.25);justify-content:center;padding:0}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}#sh.o{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.cg button{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:8px 2px}.cg .on{border:2px solid var(--acc)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.kp b{display:block;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px}.bars i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}
.bl{display:flex;gap:2px;font-size:9px;color:var(--mut)}.bl span{flex:1;text-align:center}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.pr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
@media print{nav,.np,#mn{display:none!important}body{background:#fff;color:#000}.card{border-color:#999}}
</style>
</head>
<body>
<div id="app">
  <div id="mn"><button id="pv">السابق</button><b id="ml"></b><button id="nx">التالي</button></div>
  <main id="v"></main>
</div>
<nav>
  <button data-t="home"><span>🧾</span>المصروفات</button>
  <button data-t="stats"><span>📊</span>إحصائيات</button>
  <button class="fab" id="add" aria-label="إضافة مصروف">+</button>
  <button data-t="rep"><span>📄</span>تقارير</button>
  <button data-t="set"><span>⚙️</span>إعدادات</button>
</nav>
<div id="sh"></div>
<script src="firebase-config.js"></script>
<script>
const KEY='exp1',PAL=['#1b7f5c','#2f80c9','#e0a526','#c4472f','#7a5bc9','#16a0a8','#d9638c','#8a9a2b','#e07a2f','#5a6b78','#3a9d3a','#b0623f'];
const DC=[['مياه','💧'],['كهرباء','⚡'],['بقالة','🛒'],['غاز','🔥'],['إنترنت وموبايل','📱'],['مواصلات','🚗'],['إيجار','🏠'],['صحة','💊'],['تعليم','📚'],['مطاعم','🍽️'],['ملابس','👕'],['ترفيه','🎬'],['أخرى','📦']];
const DEF=()=>({cats:DC.map((x,i)=>({id:'c'+i,n:x[0],e:x[1]})),tx:[],cur:'ج.م',bud:0});
let S=DEF();
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.tx&&j.cats)S=j}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=n=>(+n.toFixed(2)).toLocaleString('en-US')+' '+S.cur;
const num=s=>parseFloat(String(s).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[٫,]/g,'.'))||0;
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TD=()=>iso(new Date());
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mLabel=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const shift=(m,k)=>iso(new Date(+m.slice(0,4),+m.slice(5)-1+k,1)).slice(0,7);
const dLabel=d=>new Date(d+'T12:00').toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
const cat=id=>S.cats.find(c=>c.id===id)||{n:'غير مصنف',e:'❓'};
const col=id=>PAL[Math.max(0,S.cats.findIndex(c=>c.id===id))%PAL.length];
const mR=m=>[m+'-01',m+'-31'];
const inR=(a,b)=>S.tx.filter(t=>t.d>=a&&t.d<=b);
const tot=l=>l.reduce((s,t)=>s+t.a,0);
const byCat=l=>{const m={};l.forEach(t=>{m[t.c]=m[t.c]||{id:t.c,t:0,k:0};m[t.c].t+=t.a;m[t.c].k++});return Object.values(m).sort((a,b)=>b.t-a.t)};
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
let tab='home',mon=TD().slice(0,7),rep={from:TD().slice(0,8)+'01',to:TD()},selC='';

function item(t){const c=cat(t.c);return `<button class="it" data-id="${t.id}"><span class="ic" style="background:${col(t.c)}33">${c.e}</span><span class="tx"><b>${esc(c.n)}</b><small>${t.by?esc(t.by)+(t.n?' · ':''):''}${esc(t.n||'')}</small></span><b>${money(t.a)}</b></button>`}
function home(){
  const [a,b]=mR(mon),l=inR(a,b).sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id),T=tot(l),td=tot(S.tx.filter(t=>t.d===TD()));
  let bud='';
  if(S.bud>0){const p=T/S.bud*100;bud=`<div class="bar"><i style="width:${Math.min(p,100)}%;background:${p>100?'var(--bad)':'var(--acc)'}"></i></div><small>${p>100?'تجاوزت الميزانية بمقدار '+money(T-S.bud):'المتبقي '+money(S.bud-T)+' من '+money(S.bud)}</small><br>`}
  let h=`<div class="card"><small>إجمالي ${mLabel(mon)}</small><div class="big">${money(T)}</div>${bud}<small>مصروف اليوم: ${money(td)}</small></div>`;
  if(!l.length)return h+'<div class="card mut">لا توجد مصروفات في هذا الشهر. اضغط + لإضافة أول مصروف.</div>';
  let last='';
  l.forEach(t=>{if(t.d!==last){last=t.d;h+=`<div class="dh"><b>${dLabel(t.d)}</b><small>${money(tot(l.filter(x=>x.d===t.d)))}</small></div>`}h+=item(t)});
  return h;
}
function stats(){
  const [a,b]=mR(mon),l=inR(a,b),T=tot(l);
  if(!l.length)return '<div class="card mut">لا توجد مصروفات في هذا الشهر.</div>';
  const cs=byCat(l),y=+mon.slice(0,4),m=+mon.slice(5),dn=new Date(y,m,0).getDate(),ds=Array(dn).fill(0);
  l.forEach(t=>ds[+t.d.slice(8)-1]+=t.a);
  const mx=Math.max(...ds),el=mon===TD().slice(0,7)?+TD().slice(8):dn,pT=tot(inR(...mR(shift(mon,-1)))),df=pT?(T-pT)/pT*100:null;
  let off=25,seg='';
  cs.forEach(x=>{const p=x.t/T*100;seg+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${col(x.id)}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p});
  let h=`<div class="card" style="text-align:center"><svg viewBox="0 0 42 42" width="170" height="170"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="6"/>${seg}</svg><div class="big">${money(T)}</div></div>`;
  h+=`<div class="kp"><div><small>المتوسط اليومي</small><b>${money(T/el)}</b></div><div><small>أعلى يوم</small><b>${ds.indexOf(mx)+1} ${MN[m-1]}</b><small>${money(mx)}</small></div><div><small>أكبر تصنيف</small><b>${cat(cs[0].id).e} ${esc(cat(cs[0].id).n)}</b></div><div><small>مقارنة بالشهر الماضي</small><b style="color:${df>0?'var(--bad)':'var(--acc)'}">${df===null?'—':(df>0?'▲ ':'▼ ')+Math.abs(df).toFixed(0)+'%'}</b></div></div>`;
  h+='<div class="card"><b>حسب التصنيف</b>'+cs.map(x=>{const c=cat(x.id),p=x.t/T*100;return `<div class="rw" style="margin-top:10px"><span>${c.e} ${esc(c.n)} <small>(${x.k})</small></span><span>${money(x.t)} · ${p.toFixed(0)}%</span></div><div class="bar"><i style="width:${p}%;background:${col(x.id)}"></i></div>`}).join('')+'</div>';
  h+=people(l,T);
  h+=`<div class="card"><b>المصروف اليومي</b><div class="bars" style="margin-top:10px">${ds.map((v,i)=>`<i style="height:${v/mx*100}%" title="${i+1}: ${v}"></i>`).join('')}</div><div class="bl">${ds.map((v,i)=>`<span>${(i+1)%5==0||i==0?i+1:''}</span>`).join('')}</div></div>`;
  return h;
}
function repText(){
  const l=inR(rep.from,rep.to),T=tot(l);
  return `تقرير المصاريف من ${rep.from} إلى ${rep.to}\nالإجمالي: ${money(T)} (${l.length} عملية)\n`+byCat(l).map(x=>`${cat(x.id).e} ${cat(x.id).n}: ${money(x.t)}`).join('\n');
}
function report(){
  if(rep.from>rep.to)rep={from:rep.to,to:rep.from};
  const {from:a,to:b}=rep,l=inR(a,b),T=tot(l),cs=byCat(l),days=Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)+1);
  let h=`<div class="card np"><div class="pr"><button data-p="m">هذا الشهر</button><button data-p="p">الشهر الماضي</button><button data-p="30">آخر 30 يوم</button><button data-p="y">هذه السنة</button></div><label>من<input type="date" id="rf" value="${a}"></label><label>إلى<input type="date" id="rt" value="${b}"></label></div>`;
  h+=`<div class="card"><b>تقرير من ${a} إلى ${b}</b><div class="big">${money(T)}</div><small>${l.length} عملية · متوسط يومي ${money(T/days)} · متوسط العملية ${money(l.length?T/l.length:0)}</small></div>`;
  if(!l.length)return h+'<div class="card mut">لا توجد بيانات في هذه الفترة.</div>';
  h+='<div class="card"><b>ملخص التصنيفات</b><table class="tb"><tr><th>التصنيف</th><th>العدد</th><th>الإجمالي</th><th>%</th></tr>'+cs.map(x=>`<tr><td>${cat(x.id).e} ${esc(cat(x.id).n)}</td><td>${x.k}</td><td>${money(x.t)}</td><td>${(x.t/T*100).toFixed(0)}%</td></tr>`).join('')+'</table></div>';
  h+=people(l,T);
  if(days>62){const mm={};l.forEach(t=>mm[t.d.slice(0,7)]=(mm[t.d.slice(0,7)]||0)+t.a);h+='<div class="card"><b>حسب الشهر</b><table class="tb">'+Object.keys(mm).sort().map(k=>`<tr><td>${mLabel(k)}</td><td>${money(mm[k])}</td></tr>`).join('')+'</table></div>'}
  h+='<div class="card"><b>أكبر 5 مصروفات</b><table class="tb">'+l.slice().sort((x,y)=>y.a-x.a).slice(0,5).map(t=>`<tr><td>${t.d}</td><td>${cat(t.c).e} ${esc(cat(t.c).n)}</td><td>${esc(t.n||'')}</td><td>${money(t.a)}</td></tr>`).join('')+'</table></div>';
  return h+'<div class="np rw"><button class="pri" data-a="print">طباعة / PDF</button><button data-a="csv">تصدير CSV</button><button data-a="share">مشاركة</button></div>';
}
function settings(){
  return `${shareCard()}<div class="card"><label>رمز العملة<input id="cu" value="${esc(S.cur)}"></label><label>ميزانية شهرية (اتركها 0 لو مش عايز ميزانية)<input id="bu" inputmode="decimal" value="${S.bud||''}"></label></div>
<div class="card"><b>التصنيفات</b>${S.cats.map((c,i)=>`<div class="rw"><span>${c.e} ${esc(c.n)}</span><button class="dng" data-a="delcat" data-i="${i}">حذف</button></div>`).join('')}<div class="rw"><input id="ne" placeholder="😀" style="width:70px"><input id="nn" placeholder="اسم تصنيف جديد"><button class="pri" data-a="addcat">إضافة</button></div></div>
<div class="card"><b>النسخ الاحتياطي</b><p><small>بياناتك محفوظة على جهازك فقط. لو مسحت بيانات المتصفح هتضيع، فاعمل نسخة احتياطية من وقت لآخر.</small></p><div class="rw"><button data-a="exp">تصدير نسخة</button><label class="btn">استيراد نسخة<input type="file" id="imp" accept=".json" hidden></label><button class="dng" data-a="reset">مسح كل البيانات</button></div></div>`;
}
function render(){
  $('#mn').style.display=(tab=='home'||tab=='stats')?'flex':'none';$('#ml').textContent=mLabel(mon);
  $('#v').innerHTML=({home,stats,rep:report,set:settings})[tab]();
  document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
function closeS(){$('#sh').classList.remove('o');$('#sh').innerHTML=''}
function sheet(id){
  const t=id?S.tx.find(x=>x.id===id):{d:TD(),a:'',c:S.last||(S.cats[0]&&S.cats[0].id),n:''};
  if(!t)return;selC=t.c;
  $('#sh').innerHTML=`<div class="sheet"><h3 style="margin-top:0">${id?'تعديل مصروف':'مصروف جديد'}</h3><input id="fa" inputmode="decimal" placeholder="المبلغ" value="${t.a}" style="font-size:24px"><div class="cg">${S.cats.map(c=>`<button data-c="${c.id}" class="${c.id===selC?'on':''}"><span style="font-size:22px">${c.e}</span>${esc(c.n)}</button>`).join('')}</div><input type="date" id="fd" value="${t.d}"><input id="fn" placeholder="ملاحظة (اختياري)" value="${esc(t.n)}"><div class="rw" style="margin-top:10px"><button class="pri" id="ok">حفظ</button>${id?'<button class="dng" id="del">حذف</button>':''}<button id="no">إلغاء</button></div></div>`;
  $('#sh').classList.add('o');if(!id)setTimeout(()=>$('#fa').focus(),50);
  $('#sh').onclick=e=>{
    const b=e.target.closest('button');
    if(e.target===$('#sh')||(b&&b.id==='no'))return closeS();
    if(!b)return;
    if(b.dataset.c){selC=b.dataset.c;document.querySelectorAll('.cg button').forEach(x=>x.classList.toggle('on',x===b));return}
    if(b.id==='del'){if(confirm('حذف هذا المصروف؟')){S.tx=S.tx.filter(x=>x.id!==id);save();rm(id);closeS();render()}return}
    if(b.id==='ok'){
      const a=num($('#fa').value);if(a<=0){$('#fa').focus();return}
      const o={id:id||Date.now()*1000+Math.floor(Math.random()*1000),d:$('#fd').value||TD(),a,c:selC,n:$('#fn').value.trim(),by:(id&&t.by)||S.me||''};
      S.tx=id?S.tx.map(x=>x.id===id?o:x):S.tx.concat(o);S.last=selC;mon=o.d.slice(0,7);save();put(o);closeS();render();
    }
  };
}
$('#v').onclick=e=>{
  const t=e.target.closest('[data-id],[data-p],[data-a]');if(!t)return;const d=t.dataset;
  if(d.id)return sheet(+d.id);
  if(d.p){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
    rep=d.p==='m'?{from:TD().slice(0,8)+'01',to:TD()}:d.p==='p'?{from:iso(new Date(y,m-1,1)),to:iso(new Date(y,m,0))}:d.p==='30'?{from:iso(new Date(Date.now()-29*864e5)),to:TD()}:{from:y+'-01-01',to:TD()};
    return render()}
  switch(d.a){
    case 'cpcode':navigator.clipboard&&navigator.clipboard.writeText(S.sp).then(()=>alert('تم نسخ الكود'));break;
    case 'leave':if(confirm('الخروج من المساحة؟ هتفضل نسخة من البيانات على جهازك.')){cloudStop();S.sp='';save();render()}break;
    case 'join':{const me=$('#me').value.trim();if(!me)return $('#me').focus();let c=$('#sp').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(!c)c=newCode();S.me=me;S.sp=c;save();cloudStart(true);render();break}
    case 'print':window.print();break;
    case 'csv':{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';dl('expenses.csv','\ufeff'+['التاريخ,التصنيف,المبلغ,ملاحظة'].concat(inR(rep.from,rep.to).sort((x,y)=>x.d.localeCompare(y.d)).map(t=>[t.d,q(cat(t.c).n),t.a,q(t.n||'')].join(','))).join('\n'),'text/csv');break}
    case 'share':{const x=repText();navigator.share?navigator.share({title:'تقرير المصاريف',text:x}).catch(()=>{}):navigator.clipboard.writeText(x).then(()=>alert('تم نسخ التقرير'));break}
    case 'exp':dl('expenses-backup-'+TD()+'.json',JSON.stringify(S),'application/json');break;
    case 'reset':if(S.sp)return alert('اخرج من المساحة المشتركة أولاً حتى لا تُمسح بيانات الآخرين.');if(confirm('سيتم مسح كل المصروفات والتصنيفات. متأكد؟')){S=DEF();save();render()}break;
    case 'delcat':if(confirm('حذف هذا التصنيف؟ المصروفات القديمة ستظهر كغير مصنفة.')){S.cats.splice(+d.i,1);save();meta();render()}break;
    case 'addcat':{const n=$('#nn').value.trim();if(!n)return $('#nn').focus();S.cats.push({id:'c'+Date.now(),n,e:$('#ne').value.trim()||'📌'});save();meta();render()}
  }
};
$('#v').onchange=e=>{
  const i=e.target;
  if(i.id==='rf'||i.id==='rt'){rep={from:$('#rf').value||rep.from,to:$('#rt').value||rep.to};render()}
  else if(i.id==='cu'){S.cur=i.value.trim()||'ج.م';save();meta()}
  else if(i.id==='bu'){S.bud=num(i.value);save();meta()}
  else if(i.id==='imp'&&i.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.tx)||!Array.isArray(j.cats))throw 0;if(S.sp)return alert('اخرج من المساحة المشتركة قبل الاستيراد.');if(confirm('استبدال البيانات الحالية بالنسخة المستوردة؟')){S=j;save();render()}}catch(_){alert('الملف غير صالح')}};r.readAsText(i.files[0])}
};
document.querySelectorAll('nav [data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
$('#add').onclick=()=>sheet();
$('#pv').onclick=()=>{mon=shift(mon,-1);render()};
$('#nx').onclick=()=>{mon=shift(mon,1);render()};

/* ===== المشاركة السحابية (Firebase) ===== */
let DB=null,unsub=[],cst='';
const SDK=['app','auth','firestore'].map(x=>'https://www.gstatic.com/firebasejs/10.12.2/firebase-'+x+'-compat.js');
const loadSDK=()=>SDK.reduce((p,u)=>p.then(()=>new Promise((r,j)=>{const e=document.createElement('script');e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)})),Promise.resolve());
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
const dref=()=>DB&&S.sp?DB.collection('spaces').doc(S.sp):null;
const put=o=>{const r=dref();r&&r.collection('tx').doc(String(o.id)).set(o).catch(()=>{})};
const rm=id=>{const r=dref();r&&r.collection('tx').doc(String(id)).delete().catch(()=>{})};
const meta=()=>{const r=dref();r&&r.set({cats:S.cats,cur:S.cur,bud:S.bud||0}).catch(()=>{})};
const setSt=t=>{cst=t;if(tab==='set')render()};
function cloudStop(){unsub.forEach(f=>f());unsub=[];DB=null}
async function cloudStart(first){
  if(!S.sp||!window.FB_CONFIG||!FB_CONFIG.apiKey)return;
  cloudStop();setSt('جاري الاتصال...');
  try{
    if(!window.firebase)await loadSDK();
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    const au=firebase.auth();
    const u=await new Promise(r=>{const f=au.onAuthStateChanged(x=>{f();r(x)})});
    if(!u)await au.signInAnonymously();
    DB=firebase.firestore();
    try{await DB.enablePersistence({synchronizeTabs:true})}catch(e){}
    const ref=dref();
    if(first){
      if(S.tx.length&&confirm('عندك مصروفات على الجهاز. نرفعها للمساحة المشتركة؟ (لو رفضت، هتتبدل ببيانات المساحة)')){
        for(let i=0;i<S.tx.length;i+=400){const b=DB.batch();S.tx.slice(i,i+400).forEach(t=>b.set(ref.collection('tx').doc(String(t.id)),Object.assign({by:S.me},t)));await b.commit()}
      }
      ref.get().then(d=>{if(!d.exists)meta()}).catch(()=>{});
    }
    unsub.push(ref.collection('tx').onSnapshot(s=>{S.tx=s.docs.map(d=>d.data());save();setSt(s.metadata.fromCache?'غير متصل حالياً، التغييرات هتتزامن لما الإنترنت يرجع':'متصل ومتزامن ✓');render()}));
    unsub.push(ref.onSnapshot(d=>{const v=d.data();if(v&&v.cats){S.cats=v.cats;S.cur=v.cur||S.cur;S.bud=v.bud||0;save();render()}}));
  }catch(e){setSt('تعذر الاتصال: '+((e&&e.message)||e))}
}
function shareCard(){
  if(!window.FB_CONFIG||!FB_CONFIG.apiKey)return '<div class="card"><b>👨‍👩‍👧 المشاركة بين أكثر من شخص</b><p><small>لتفعيلها لازم تضيف إعدادات Firebase في ملف firebase-config.js.</small></p></div>';
  if(S.sp)return `<div class="card"><b>👨‍👩‍👧 مساحة مشتركة</b><p><small>${esc(cst||'جاري الاتصال...')}</small></p><div class="rw"><span>اسمك: ${esc(S.me||'')}</span></div><div class="rw"><code style="direction:ltr;font-size:18px">${esc(S.sp)}</code><button data-a="cpcode">نسخ الكود</button></div><small>أعطِ الكود للشخص الآخر عشان يدخل نفس المساحة.</small><div class="rw" style="margin-top:8px"><button class="dng" data-a="leave">الخروج من المساحة</button></div></div>`;
  return `<div class="card"><b>👨‍👩‍👧 المشاركة بين أكثر من شخص</b><p><small>اكتب اسمك. اترك الكود فاضي لإنشاء مساحة جديدة، أو اكتب كود مساحة موجودة للانضمام.</small></p><input id="me" placeholder="اسمك" value="${esc(S.me||'')}"><input id="sp" placeholder="كود المساحة (اختياري)" style="direction:ltr"><button class="pri" data-a="join">تفعيل المشاركة</button></div>`;
}
function people(l,T){
  const m={};l.forEach(t=>{const k=t.by||'—';m[k]=(m[k]||0)+t.a});const k=Object.keys(m);
  if(k.length<2)return '';
  return '<div class="card"><b>حسب الشخص</b>'+k.sort((a,b)=>m[b]-m[a]).map(n=>`<div class="rw" style="margin-top:8px"><span>👤 ${esc(n)}</span><span>${money(m[n])} · ${(m[n]/T*100).toFixed(0)}%</span></div><div class="bar"><i style="width:${m[n]/T*100}%"></i></div>`).join('')+'</div>';
}
render();cloudStart();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
